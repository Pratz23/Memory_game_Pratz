<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whack-a-Mole</title>
    <style>
        :root {
            --bg: #f4f1de;
            --panel: #fefae0;
            --grass: #7bc96f;
            --grass-dark: #4d9b46;
            --soil: #6b4f3a;
            --hole: #402d21;
            --text: #1e1e1e;
            --accent: #ef476f;
            --accent-dark: #d9325d;
            --button: #2a9d8f;
            --button-hover: #23857b;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(180deg, #d9f2ff 0%, var(--bg) 100%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            padding: 20px;
        }

        .game-shell {
            width: min(100%, 520px);
            background: var(--panel);
            border-radius: 18px;
            box-shadow: 0 12px 28px var(--shadow);
            padding: 22px 18px 18px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 4vw, 2.6rem);
            color: var(--text);
        }

        .status-bar {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat {
            background: #fff;
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.04);
        }

        .label {
            display: block;
            font-size: 0.76rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #555;
            margin-bottom: 4px;
        }

        .value {
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 18px;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--button);
            color: #fff;
            transition: transform 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: var(--button-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: linear-gradient(180deg, var(--grass) 0%, var(--grass-dark) 100%);
            border-radius: 18px;
            padding: 12px;
            border: 6px solid #4b8e47;
        }

        .hole {
            position: relative;
            aspect-ratio: 1;
            border: none;
            background: var(--hole);
            border-radius: 50%;
            overflow: hidden;
            cursor: pointer;
            box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.05), inset 0 -10px 18px rgba(0,0,0,0.25);
        }

        .hole::before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            bottom: 8%;
            height: 28%;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.2);
        }

        .mole {
            position: absolute;
            left: 50%;
            bottom: -16%;
            width: 68%;
            height: 68%;
            background: radial-gradient(circle at 40% 28%, #f3d4ad 0%, #d9a56a 24%, #b16d3a 55%, #7a4121 100%);
            border-radius: 50% 50% 45% 45%;
            transform: translateX(-50%) translateY(110%);
            transition: transform 0.15s ease;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.12);
        }

        .hole.active .mole {
            transform: translateX(-50%) translateY(0);
        }

        .hole.active {
            box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.05), inset 0 -10px 18px rgba(0,0,0,0.25), 0 0 0 2px rgba(255,255,255,0.3);
        }

        .hole.hit {
            animation: hitPulse 0.18s ease;
        }

        @keyframes hitPulse {
            0% { transform: scale(1); }
            35% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .message {
            text-align: center;
            margin-top: 16px;
            min-height: 24px;
            font-weight: 700;
            color: var(--text);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 480px) {
            .game-shell {
                padding: 16px 12px 14px;
            }

            .status-bar {
                gap: 8px;
            }

            .stat {
                padding: 8px 6px;
            }

            .board {
                gap: 10px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <header class="header">
            <h1>Whack-a-Mole</h1>
        </header>

        <div class="status-bar" aria-live="polite">
            <div class="stat">
                <span class="label">Score</span>
                <span id="score" class="value">0</span>
            </div>
            <div class="stat">
                <span class="label">Time</span>
                <span id="time" class="value">30</span>
            </div>
            <div class="stat">
                <span class="label">Best</span>
                <span id="best-score" class="value">0</span>
            </div>
        </div>

        <div class="controls">
            <button id="start-btn" type="button">Start Game</button>
        </div>

        <div id="board" class="board" aria-label="Whack-a-Mole game board">
            <button class="hole" type="button" aria-label="Mole hole 1">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 2">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 3">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 4">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 5">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 6">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 7">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 8">
                <span class="mole" aria-hidden="true"></span>
            </button>
            <button class="hole" type="button" aria-label="Mole hole 9">
                <span class="mole" aria-hidden="true"></span>
            </button>
        </div>

        <div id="message" class="message" aria-live="polite"></div>
    </div>

    <script>
        const holes = Array.from(document.querySelectorAll('.hole'));
        const scoreEl = document.getElementById('score');
        const timeEl = document.getElementById('time');
        const bestScoreEl = document.getElementById('best-score');
        const startBtn = document.getElementById('start-btn');
        const messageEl = document.getElementById('message');

        const gameState = {
            score: 0,
            timeLeft: 30,
            activeHole: null,
            gameActive: false,
            countdownId: null,
            moleId: null,
            moleLoopId: null,
            bestScore: Number(localStorage.getItem('whackAMoleBestScore') || 0)
        };

        bestScoreEl.textContent = gameState.bestScore;

        function clearMole() {
            holes.forEach((hole) => hole.classList.remove('active', 'hit'));
            gameState.activeHole = null;
        }

        function updateBestScore() {
            if (gameState.score > gameState.bestScore) {
                gameState.bestScore = gameState.score;
                localStorage.setItem('whackAMoleBestScore', String(gameState.bestScore));
            }
            bestScoreEl.textContent = gameState.bestScore;
        }

        function randomHole() {
            const nextIndex = Math.floor(Math.random() * holes.length);
            const nextHole = holes[nextIndex];

            if (nextHole === gameState.activeHole) {
                return randomHole();
            }

            return nextHole;
        }

        function showMole() {
            if (!gameState.gameActive) return;

            clearMole();
            const nextHole = randomHole();
            nextHole.classList.add('active');
            gameState.activeHole = nextHole;

            gameState.moleId = setTimeout(() => {
                if (gameState.gameActive && nextHole === gameState.activeHole) {
                    clearMole();
                }
            }, 700);
        }

        function updateScore(value) {
            gameState.score += value;
            scoreEl.textContent = gameState.score;
            updateBestScore();
        }

        function endGame() {
            gameState.gameActive = false;
            clearInterval(gameState.countdownId);
            clearInterval(gameState.moleLoopId);
            clearTimeout(gameState.moleId);
            clearMole();
            updateBestScore();
            messageEl.textContent = `Time's up! Final score: ${gameState.score}`;
            startBtn.textContent = 'Play Again';
        }

        function startGame() {
            clearInterval(gameState.countdownId);
            clearInterval(gameState.moleLoopId);
            clearTimeout(gameState.moleId);
            clearMole();

            gameState.score = 0;
            gameState.timeLeft = 30;
            gameState.gameActive = true;
            scoreEl.textContent = gameState.score;
            timeEl.textContent = gameState.timeLeft;
            messageEl.textContent = 'Go! Hit the mole!';
            startBtn.textContent = 'Restart Game';

            gameState.countdownId = setInterval(() => {
                gameState.timeLeft -= 1;
                timeEl.textContent = gameState.timeLeft;

                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            showMole();
            gameState.moleLoopId = setInterval(() => {
                if (gameState.gameActive) {
                    showMole();
                }
            }, 900);
        }

        holes.forEach((hole) => {
            hole.addEventListener('click', () => {
                if (!gameState.gameActive) return;

                if (hole === gameState.activeHole) {
                    hole.classList.add('hit');
                    updateScore(1);
                    clearTimeout(gameState.moleId);
                    clearMole();
                    showMole();
                }
            });
        });

        startBtn.addEventListener('click', startGame);

        messageEl.textContent = 'Press Start to begin!';
    </script>
</body>
</html>
